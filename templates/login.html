{% extends "base.html" %}

{% block title %}Sign In - eSavadh{% endblock %}

{% block content %}
<div class="login-container" style="max-width: 520px; margin: 2.5rem auto; border: 1px solid var(--color-ledger-rule-dark); background: #FFFFFF; box-shadow: 0 4px 15px rgba(0,0,0,0.06);">
    <div class="login-header" style="background-color: var(--color-plum); color: #FFFFFF; padding: 1.75rem; text-align: center; border-bottom: 3px solid var(--color-brass);">
        <h2 style="font-family: var(--font-serif); font-size: 1.45rem; font-weight: 700;">Legal Metrology Access Portal</h2>
        <p style="font-size: 0.8rem; color: var(--color-brass-muted); margin-top: 0.25rem;">Authorized Personnel & Stakeholder Authentication</p>
    </div>

    <div class="login-body" style="padding: 1.75rem;">
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label" for="email">Official Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="e.g. inspector@esavadh.gov.in" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter security credentials" 
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                Authenticate & Access Workspace
            </button>
        </form>

        <div class="quick-roles-card" style="margin-top: 1.5rem; padding: 1rem; background: var(--color-ledger); border: 1px dashed var(--color-ledger-rule-dark);">
            <div class="quick-roles-title" style="font-size: 0.75rem; font-weight: 700; color: var(--color-plum); text-transform: uppercase; margin-bottom: 0.6rem;">
                Official Role Profiles (Demo Test Suite)
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                <button 
                    type="button" 
                    class="btn btn-outline btn-sm" 
                    onclick="fillLogin('inspector@esavadh.gov.in', 'inspector123')"
                >
                    &bull; Role: Inspector
                </button>
                <button 
                    type="button" 
                    class="btn btn-outline btn-sm" 
                    onclick="fillLogin('admin@esavadh.gov.in', 'admin123')"
                >
                    &bull; Role: Admin
                </button>
            </div>
            <div class="form-hint" style="text-align: center; margin-top: 0.6rem;">
                Click any role profile to populate verified credentials.
            </div>
        </div>
    </div>
</div>
{% endblock %}
